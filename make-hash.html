<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student line banao</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;color:#1b2430}
input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
button{background:#0b2a5b;color:#fff;border:0;border-radius:6px}
textarea{width:100%;height:110px;font-size:14px;box-sizing:border-box}
</style></head><body>
<h2>Student ki line banao</h2>
<input id="n" placeholder="Student ka naam">
<input id="e" placeholder="Email">
<input id="p" placeholder="Password (aap tay karo)">
<input id="c" placeholder='Courses: all  ya  gst-basics,tally-basics' value="all">
<button onclick="go()">Line banao</button>
<p>Ye line copy karke <b>students.js</b> ki list mein paste karo:</p>
<textarea id="o" readonly></textarea>
<script>
async function go(){
  const email=e.value.trim().toLowerCase(), pass=p.value;
  if(!email||!pass){o.value="Email aur password dono likho.";return;}
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(email+":"+pass));
  const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  const courses=c.value.split(",").map(x=>'"'+x.trim()+'"').join(", ");
  o.value='  { name: "'+n.value.trim()+'", email: "'+email+'", hash: "'+hash+'", courses: ['+courses+'] },';
}
</script></body></html>
