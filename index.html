<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accountant Bano</title>
<style>
:root{--blue:#0b2a5b;--line:#d9dee7;--bg:#fff;--text:#1b2430;--soft:#f3f6fb}
@media(prefers-color-scheme:dark){:root{--blue:#8fb4ff;--line:#2c3646;--bg:#10151d;--text:#e8edf5;--soft:#18202c}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;color:var(--blue)}
main{max-width:900px;margin:0 auto;padding:18px}
button,input{font-size:17px;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{background:var(--blue);color:var(--bg);border:0;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#10151d}}
.btn.alt{background:none;color:var(--blue);border:1px solid var(--blue)}
.login{max-width:380px;margin:50px auto}
.login input{width:100%;margin:6px 0}
.login .btn{width:100%;margin-top:8px}
.err{color:#c0392b;min-height:24px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0;background:var(--soft)}
.card h3{margin:0 0 6px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lesson:first-of-type{border-top:0}
.player{position:relative;padding-top:56.25%;margin:12px 0;background:#000;border-radius:8px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hidden{display:none}
a.btn{display:inline-block;text-decoration:none}
:focus-visible{outline:3px solid #2f7bff;outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="brand">Accountant Bano</h1><button class="btn alt hidden" id="logout">Logout</button></header>
<main>
  <section id="loginView" class="login">
    <h2>Login karein</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" id="loginBtn">Login</button>
    <p id="support"></p>
  </section>

  <section id="coursesView" class="hidden">
    <h2 id="hello"></h2>
    <div id="courseList"></div>
  </section>

  <section id="lessonsView" class="hidden">
    <button class="btn alt" id="back">Courses par wapas</button>
    <h2 id="courseTitle"></h2>
    <div class="player hidden" id="player"><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    <div id="lessonList"></div>
  </section>
</main>
<script src="students.js"></script>
<script src="content.js"></script>
<script>
const $=id=>document.getElementById(id);
let me=null;

document.title=SITE.name; $("brand").textContent=SITE.name;
$("support").innerHTML=SITE.supportText+' <a href="https://wa.me/'+SITE.whatsapp+'">WhatsApp</a>';

async function sha(text){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function show(view){
  ["loginView","coursesView","lessonsView"].forEach(v=>$(v).classList.toggle("hidden",v!==view));
  $("logout").classList.toggle("hidden",view==="loginView");
}

async function login(){
  const email=$("email").value.trim().toLowerCase(), pass=$("pass").value;
  $("err").textContent="";
  if(!email||!pass){$("err").textContent="Email aur password dono likhein.";return;}
  const hash=await sha(email+":"+pass);
  const s=STUDENTS.find(x=>x.email.toLowerCase()===email&&x.hash===hash);
  if(!s){$("err").textContent="Email ya password galat hai.";return;}
  sessionStorage.setItem("ab_user",email);
  me=s; showCourses();
}

function myCourses(){
  return COURSES.filter(c=>me.courses.includes("all")||me.courses.includes(c.id));
}

function showCourses(){
  $("hello").textContent="Namaste, "+me.name;
  const list=myCourses();
  $("courseList").innerHTML=list.length?"":"<p>Abhi koi course available nahi hai. WhatsApp par sampark karein.</p>";
  list.forEach(c=>{
    const d=document.createElement("div"); d.className="card";
    d.innerHTML="<h3></h3><p></p>";
    d.querySelector("h3").textContent=c.title;
    d.querySelector("p").textContent=c.description;
    const b=document.createElement("button"); b.className="btn"; b.textContent="Start Learning";
    b.onclick=()=>showLessons(c); d.appendChild(b);
    $("courseList").appendChild(d);
  });
  show("coursesView");
}

function driveId(u){const m=u.match(/\/d\/([^/?]+)/)||u.match(/[?&]id=([^&]+)/);return m?m[1]:null;}
function ytId(u){const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:null;}
function embedUrl(u){
  const y=ytId(u); if(y) return "https://www.youtube-nocookie.com/embed/"+y+"?rel=0";
  const d=driveId(u); if(d) return "https://drive.google.com/file/d/"+d+"/preview";
  return u;
}
function pdfUrl(u){const d=driveId(u);return d?"https://drive.google.com/file/d/"+d+"/view":u;}

function showLessons(c){
  $("courseTitle").textContent=c.title;
  $("player").classList.add("hidden"); $("frame").src="";
  $("lessonList").innerHTML="";
  c.lessons.forEach(l=>{
    const row=document.createElement("div"); row.className="lesson";
    const t=document.createElement("strong"); t.textContent=l.title; row.appendChild(t);
    const box=document.createElement("div");
    if(l.video){
      const v=document.createElement("button"); v.className="btn"; v.textContent="Video dekhein";
      v.onclick=()=>{$("frame").src=embedUrl(l.video);$("player").classList.remove("hidden");$("player").scrollIntoView({behavior:"smooth"});};
      box.appendChild(v);
    }
    if(l.pdf){
      const a=document.createElement("a"); a.className="btn alt"; a.textContent="PDF notes";
      a.href=pdfUrl(l.pdf); a.target="_blank"; a.rel="noopener"; a.style.marginLeft="8px";
      box.appendChild(a);
    }
    row.appendChild(box); $("lessonList").appendChild(row);
  });
  show("lessonsView");
}

$("loginBtn").onclick=login;
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
$("back").onclick=()=>{$("frame").src="";showCourses();};
$("logout").onclick=()=>{sessionStorage.removeItem("ab_user");me=null;$("frame").src="";$("pass").value="";show("loginView");};

(function restore(){
  try{
    const e=sessionStorage.getItem("ab_user");
    const s=e&&STUDENTS.find(x=>x.email.toLowerCase()===e);
    if(s){me=s;showCourses();return;}
  }catch(_){}
  show("loginView");
})();
</script>
</body>
</html>
